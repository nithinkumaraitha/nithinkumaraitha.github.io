    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // Screen Reader Dynamic Announcer
      const announceToScreenReader = (message) => {
        const announcer = document.getElementById('aria-announcer');
        if (announcer) {
          announcer.textContent = '';
          setTimeout(() => {
            announcer.textContent = message;
          }, 50);
        }
      };

      // Interactive Particle Background (Simulating LiDAR Point-Clouds & Connections)
      const StellarCanvas = ({ isPaused, isHighContrast }) => {
        const canvasRef = useRef(null);

        useEffect(() => {
          if (isPaused || isHighContrast) return;

          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animationFrameId;

          const handleResize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          };
          handleResize();
          window.addEventListener('resize', handleResize);

          const numParticles = Math.min(Math.floor(window.innerWidth / 16), 65);
          const particles = [];

          for (let i = 0; i < numParticles; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              radius: Math.random() * 2 + 0.8,
              vx: (Math.random() - 0.5) * 0.4,
              vy: (Math.random() - 0.5) * 0.4,
              alpha: Math.random() * 0.6 + 0.3,
              color: Math.random() > 0.5 ? '#6366F1' : Math.random() > 0.5 ? '#06B6D4' : '#10B981'
            });
          }

          const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              p.x += p.vx;
              p.y += p.vy;

              if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
              if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.globalAlpha = p.alpha;
              ctx.fill();

              // Synthetic Point-Cloud Ray Trajectories
              for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p.x - p2.x;
                const dy = p.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 110) {
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = '#6366F1';
                  ctx.globalAlpha = (1 - dist / 110) * 0.15;
                  ctx.lineWidth = 0.8;
                  ctx.stroke();
                }
              }
            }

            animationFrameId = requestAnimationFrame(render);
          };

          render();

          return () => {
            window.removeEventListener('resize', handleResize);
            cancelAnimationFrame(animationFrameId);
          };
        }, [isPaused, isHighContrast]);

        if (isHighContrast) return null;

        return (
          <canvas
            ref={canvasRef}
            className="fixed inset-0 pointer-events-none z-0"
            aria-hidden="true"
          />
        );
      };

                        <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 block mb-1">Point Processing Time:</span>
                          <span className="text-base font-bold text-cyan-400">{metrics.latency}</span>
                        </div>
                        <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 block mb-1">Obstacle Retention Accuracy:</span>
                          <span className="text-base font-bold text-indigo-400">{metrics.accuracy}</span>
                        </div>
                        <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 block mb-1">Blind-Zone Protection:</span>
                          <span className={`text-base font-bold ${blindZoneMitigation ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {metrics.blindZoneCoverage}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </section>
        );
      };

      // Contact Form Section
      const ContactSection = () => {
        const [formState, setFormState] = useState({ name: '', email: '', message: '' });
        const [submitted, setSubmitted] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!formState.name || !formState.email || !formState.message) return;
          setSubmitted(true);
          announceToScreenReader("Thank you! Your message has been sent successfully.");
        };

        return (
          <section id="contact" className="py-20 bg-slate-900/60 border-t border-white/5">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 text-left">
              <div className="text-center max-w-xl mx-auto mb-12">
                <span className="text-xs font-mono font-bold uppercase tracking-widest text-indigo-400">Get In Touch</span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white mt-2">Connect with Nithin</h2>
                <p className="text-slate-400 text-sm mt-2">
                  Interested in robotics research, perception roles, or project collaborations? Send a message below or email directly.
                </p>
              </div>

              {submitted ? (
                <div
                  className="bg-emerald-950/60 border border-emerald-500/50 rounded-2xl p-8 text-center space-y-3 card-el"
                  role="alert"
                >
                  <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                    ✓
                  </div>
                  <h3 className="text-xl font-bold text-white">Message Dispatched!</h3>
                  <p className="text-sm text-emerald-200">
                    Thank you for reaching out. I will get back to you shortly at {formState.email}.
                  </p>
                  <button
                    onClick={() => {
                      setSubmitted(false);
                      setFormState({ name: '', email: '', message: '' });
                    }}
                    className="mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold"
                  >
                    Send Another Note
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-5 card-el shadow-xl">
                  
                  {/* Quick Info Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-4 border-b border-slate-800 text-xs">
                    <div className="flex items-center gap-2 text-slate-300">
                      <span className="text-indigo-400">📧</span>
                      <span>nithinkumar.aitha@gmail.com</span>
                    </div>
                    <div className="flex items-center gap-2 text-slate-300">
                      <span className="text-cyan-400">📍</span>
                      <span>Newark, DE | (302) 332-7277</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                      <label htmlFor="user-name" className="block text-xs font-bold text-slate-300 mb-1.5">
                        Your Full Name <span className="text-pink-400">*</span>
                      </label>
                      <input
                        id="user-name"
                        type="text"
                        required
                        placeholder="Dr. Alex Vance"
                        value={formState.name}
                        onChange={(e) => setFormState({ ...formState, name: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label htmlFor="user-email" className="block text-xs font-bold text-slate-300 mb-1.5">
                        Email Address <span className="text-pink-400">*</span>
                      </label>
                      <input
                        id="user-email"
                        type="email"
                        required
                        placeholder="alex@domain.com"
                        value={formState.email}
                        onChange={(e) => setFormState({ ...formState, email: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label htmlFor="user-message" className="block text-xs font-bold text-slate-300 mb-1.5">
                      Message <span className="text-pink-400">*</span>
                    </label>
                    <textarea
                      id="user-message"
                      rows="4"
                      required
                      placeholder="Share your inquiry, robotics role opportunity, or collaboration idea..."
                      value={formState.message}
                      onChange={(e) => setFormState({ ...formState, message: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="btn-primary w-full bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-xl shadow-indigo-500/20 transition-all"
                  >
                    Submit Message
                  </button>
                </form>
              )}
            </div>
          </section>
        );
      };

      // Footer
      const Footer = () => {
        return (
          <footer className="py-12 bg-slate-950 border-t border-slate-800 text-left text-slate-400 text-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div>
                <span className="text-white font-bold tracking-tight text-sm block">
                  NITHIN KUMAR AITHA — PORTFOLIO
                </span>
                <span className="text-slate-500 mt-1 block">
                  M.S. Robotics @ University of Delaware | LiDAR SLAM & Perception
                </span>
              </div>

              <div className="flex items-center gap-6 text-slate-300 font-semibold font-mono">
                <a href="https://github.com/nithinkumaraitha" target="_blank" rel="noopener noreferrer" className="hover:text-indigo-400">GitHub</a>
                <a href="https://linkedin.com/in/nithinkumaraitha" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-400">LinkedIn</a>
                <a href="#hero" className="hover:text-indigo-400">Top ↑</a>
              </div>

            </div>
          </footer>
        );
      };

      // App Root
      const App = () => {
        const [activeSection, setActiveSection] = useState('hero');
        const [theme, setTheme] = useState('stellar');
        const [fontSize, setFontSize] = useState('normal');
        const [fontType, setFontType] = useState('sans');
        const [reducedMotion, setReducedMotion] = useState(false);
        const [isA11yOpen, setIsA11yOpen] = useState(false);

        const themeClass = useMemo(() => {
          if (theme === 'light') return 'bg-slate-100 text-slate-900';
          if (theme === 'hc-dark') return 'theme-high-contrast-dark';
          if (theme === 'hc-light') return 'theme-high-contrast-light';
          return 'bg-stellar-bg text-slate-100';
        }, [theme]);

        const fontSizeClass = useMemo(() => {
          if (fontSize === 'large') return 'text-[115%]';
          if (fontSize === 'xlarge') return 'text-[130%]';
          return 'text-[100%]';
        }, [fontSize]);

        const fontTypeClass = useMemo(() => {
          return fontType === 'dyslexic' ? 'font-dyslexic' : '';
        }, [fontType]);

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.altKey && (e.key === 'a' || e.key === 'A')) {
              e.preventDefault();
              setIsA11yOpen(prev => !prev);
            }
          };
          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, []);

        return (
          <div className={`min-h-screen ${themeClass} ${fontSizeClass} ${fontTypeClass} transition-colors duration-200 relative`}>
            
            <StellarCanvas
              isPaused={reducedMotion}
              isHighContrast={theme === 'hc-dark' || theme === 'hc-light'}
            />

            <AccessibilityControlPanel
              theme={theme}
              setTheme={setTheme}
              fontSize={fontSize}
              setFontSize={setFontSize}
              fontType={fontType}
              setFontType={setFontType}
              reducedMotion={reducedMotion}
              setReducedMotion={setReducedMotion}
              isOpen={isA11yOpen}
              setIsOpen={setIsA11yOpen}
            />

            <Navbar
              activeSection={activeSection}
              setActiveSection={setActiveSection}
            />

            <main id="main-content" className="relative z-10">
              <HeroSection />
              <ExperienceSection />
              <ProjectsSection />
              <SkillsSection />
              <PerceptionLabSection />
              <ContactSection />
            </main>

            <Footer />

          </div>
        );
      };

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
</body>
</html>
